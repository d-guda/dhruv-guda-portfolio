<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
<rect width="1200" height="510" fill="white"/>
<g font-family="Arial,sans-serif" fill="#172b3a">
<text x="35" y="42" font-size="25" font-weight="bold">S.O.F.T. - Conceptual Financial Workflow</text>
<text x="35" y="72" font-size="17">Illustrative architecture and proposed controls; no real provider implementation verified.</text>
<rect x="335" y="110" width="490" height="230" rx="12" fill="#eff6ff" stroke="#477398" stroke-width="2" stroke-dasharray="9 6"/>
<text x="355" y="139" font-size="17" font-weight="bold">Internal review and approval boundary</text>
<rect x="35" y="185" width="235" height="100" rx="10" fill="#e2e8f0" stroke="#64748b"/>
<text x="152" y="219" text-anchor="middle" font-size="20" font-weight="bold">Requester</text><text x="152" y="249" text-anchor="middle" font-size="17">Submission interface</text>
<rect x="365" y="185" width="185" height="100" rx="10" fill="#dbeafe" stroke="#477398"/>
<text x="457" y="219" text-anchor="middle" font-size="20" font-weight="bold">Reviewer</text><text x="457" y="249" text-anchor="middle" font-size="16">Verify identity + records</text>
<rect x="610" y="185" width="185" height="100" rx="10" fill="#dbeafe" stroke="#477398"/>
<text x="702" y="219" text-anchor="middle" font-size="20" font-weight="bold">Approver</text><text x="702" y="249" text-anchor="middle" font-size="16">Independent decision</text>
<rect x="905" y="185" width="255" height="100" rx="10" fill="#dcfce7" stroke="#54856a"/>
<text x="1032" y="219" text-anchor="middle" font-size="20" font-weight="bold">Payment provider</text><text x="1032" y="249" text-anchor="middle" font-size="16">Authorized transaction</text>
<g stroke="#334155" stroke-width="2.5" marker-end="url(#a)"><path d="M270 235 H355"/><path d="M550 235 H600"/><path d="M795 235 H895"/><path d="M580 340 V385"/></g>
<text x="305" y="175" text-anchor="middle" font-size="15">Request data</text><text x="847" y="175" text-anchor="middle" font-size="15">Approved payment</text>
<rect x="335" y="390" width="490" height="75" rx="10" fill="#f1f5f9" stroke="#64748b"/>
<text x="580" y="420" text-anchor="middle" font-size="20" font-weight="bold">Protected request and audit records</text><text x="580" y="446" text-anchor="middle" font-size="16">Individual identities, access controls, retention, reconciliation</text>
<text x="35" y="492" font-size="16">Boundary 1: requester to internal reviewers. Boundary 2: internal approval to payment provider.</text>
